name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath -o bin/wpstatic .

      - name: Smoke: version
        run: ./bin/wpstatic version
