# nginx config for serving the wpresto static cache with a dynamic fallback.
#
# The static cache lives in /var/www/wpresto/live (set by wpresto's
# output.dir). nginx serves it with gzip_static (pre-compressed .gz siblings)
# and falls back to the live WordPress backend for anything not cached
# (dynamic pages, search, comments, etc.).
#
# Adjust the proxy_pass target to your WordPress backend (e.g. PHP-FPM via
# fastcgi, or a container on 127.0.0.1:8081).

server {
    listen 80;
    server_name example.com;

    root /var/www/wpresto/live;
    index index.html;

    # Serve pre-compressed .gz files when the client accepts gzip.
    gzip_static on;

    # Long cache for immutable assets (hashed or versioned by WordPress).
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @dynamic;
    }

    # Static pages: serve if present, otherwise fall back to WordPress.
    location / {
        try_files $uri $uri/index.html $uri.html @dynamic;
    }

    # Fallback to the dynamic WordPress backend for uncached requests.
    location @dynamic {
        # Option A: proxy to a WordPress container / app server.
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Option B (uncomment for PHP-FPM, comment out the proxy_pass block):
        # include fastcgi_params;
        # fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_param QUERY_STRING $query_string;
    }
}
