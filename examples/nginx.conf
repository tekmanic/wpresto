# nginx config for serving the wpresto static cache with a dynamic fallback.
#
# The static cache lives in /var/www/wpresto/live (set by wpresto's
# output.dir). nginx serves it with gzip_static (pre-compressed .gz siblings).
#
# Dynamic requests are handled by the wpresto plugin server (wpresto serve),
# which is the single dynamic entry point:
#   - Requests matching a plugin route (e.g. /wpresto/contact) are answered by
#     the plugin — no WordPress backend involved.
#   - Anything else is proxied by the plugin server to the WordPress backend.
#
# So nginx just points its dynamic fallback at the plugin server (127.0.0.1:9091
# by default). Adjust the plugin server address to match plugins.listen.

upstream wpresto_plugins {
    server 127.0.0.1:9091;
}

server {
    listen 80;
    server_name example.com;

    root /var/www/wpresto/live;
    index index.html;

    # Serve pre-compressed .gz files when the client accepts gzip.
    gzip_static on;

    # Long cache for immutable assets (hashed or versioned by WordPress).
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @dynamic;
    }

    # wpresto plugin endpoints (contact form, subscribe, geoip, analytics,
    # url rewrites). These are answered by the plugin server directly.
    location /wpresto/ {
        proxy_pass http://wpresto_plugins;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static pages: serve if present, otherwise fall back to the plugin server.
    location / {
        try_files $uri $uri/index.html $uri.html @dynamic;
    }

    # Dynamic fallback: the plugin server answers plugin routes and proxies
    # everything else to the WordPress backend.
    location @dynamic {
        proxy_pass http://wpresto_plugins;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
